name: ci
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # everyday at 5am (fixed cron syntax)
  push:
    branches:
      - '**'

# Add workflow-level permissions to fix "Repository access blocked" error
permissions:
  contents: read
  packages: write
  pull-requests: write
  id-token: write

jobs:
  docker:
    runs-on: ubuntu-latest
    # Job-level permissions can be removed since we defined workflow-level permissions
    # permissions:
    #   pull-requests: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/softrams/docker-images
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=ref,event=branch
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
