# =============================================================================
# Admiral Egress Proxy Configuration (Squid)
# =============================================================================
# STRICT MODE: Block ALL traffic except exact allowlist
#
# This proxy enforces network egress controls for the opencode container.
# Only allowlisted domains can be accessed via HTTP/HTTPS.
# SSH traffic is routed through CONNECT tunnels to github.com and github.cms.gov only.
#
# Allowlist:
#   - GitHub Copilot (LLM API)
#   - AWS Bedrock (all regions)
#   - GitHub (SSH clone/push via CONNECT tunnel)
#   - JFrog Artifactory
#   - One configured CMS dev site for Playwright testing
#   - Microsoft Teams (webhooks)
#   - OpenCode CLI updates
#   - Terraform Registry (module downloads)
#   - HashiCorp releases (provider binaries)
# =============================================================================

# -----------------------------------------------------------------------------
# Network Configuration
# -----------------------------------------------------------------------------
# Listen on port 3128 for HTTP proxy connections
http_port 3128

# PID file location (must be writable by proxy user)
pid_filename /var/run/squid/squid.pid

# -----------------------------------------------------------------------------
# Domain Allowlist (HTTP/HTTPS via CONNECT method)
# -----------------------------------------------------------------------------
# ACL definitions for allowed domains
# Using dstdomain for exact domain matching, .domain for subdomains

# GitHub Copilot and related services
acl allowed_domains dstdomain .github.com
acl allowed_domains dstdomain .githubcopilot.com
acl allowed_domains dstdomain .githubusercontent.com
acl allowed_domains dstdomain .exp-tas.com
acl allowed_domains dstdomain .ghcr.io

# AWS (Bedrock and other AWS services, all regions)
acl allowed_domains dstdomain .amazonaws.com
acl allowed_domains dstdomain .aws

# CMS Infrastructure (cms.gov includes explicitly allowed CMS endpoints)
# Keep shared browser dependencies explicit so dev workspaces can load app
# configuration, SSO, and Tealium assets through the proxy.
acl allowed_domains dstdomain .cms.gov

# Restrict dev-site browser access to the configured workspace only.
# The startup script renders the UI and API hosts from DEV_WORKSPACE.
acl cms_dev_domains dstdomain .dev.4innovation.cms.gov
acl allowed_dev_workspace_ui dstdomain __DEV_WORKSPACE_HOST__
acl allowed_dev_workspace_api dstdomain __DEV_WORKSPACE_API_HOST__

# Microsoft Teams webhooks
acl allowed_domains dstdomain .webhook.office.com

# OpenCode CLI (includes app.opencode.ai and other subdomains)
acl allowed_domains dstdomain .opencode.ai

# Google AI Models (models.dev - used for LLM API access)
acl allowed_domains dstdomain .models.dev

# Terraform Registry (module downloads) and HashiCorp releases (provider binaries)
acl allowed_domains dstdomain .registry.terraform.io
acl allowed_domains dstdomain .releases.hashicorp.com

# -----------------------------------------------------------------------------
# SSH Hosts (port 22 via CONNECT tunnel)
# -----------------------------------------------------------------------------
# These hosts are allowed for SSH connections through the proxy
# The SSH client uses ProxyCommand with netcat to tunnel through Squid

acl ssh_hosts dstdomain github.com
acl ssh_hosts dstdomain github.cms.gov
acl ssh_port port 22

# -----------------------------------------------------------------------------
# Standard HTTP/HTTPS Ports
# -----------------------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# -----------------------------------------------------------------------------
# Access Control Rules
# -----------------------------------------------------------------------------
# Deny requests to non-safe ports (except SSH which is handled separately)
http_access deny !Safe_ports !ssh_port

# Allow CONNECT to SSH hosts on port 22
http_access allow CONNECT ssh_hosts ssh_port

# Deny access to all other CMS dev workspaces before the broad cms.gov allowlist.
# Allow the configured workspace UI host plus its paired API host.
http_access deny CONNECT SSL_ports cms_dev_domains !allowed_dev_workspace_ui !allowed_dev_workspace_api
http_access deny cms_dev_domains !allowed_dev_workspace_ui !allowed_dev_workspace_api

# Allow CONNECT to SSL ports for allowed domains
http_access allow CONNECT SSL_ports allowed_domains

# Deny CONNECT to other ports/hosts
http_access deny CONNECT

# Allow HTTP/HTTPS to allowed domains
http_access allow allowed_domains

# DENY ALL other traffic (strict mode)
http_access deny all

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
# Log all access attempts (allowed and denied) for auditing
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Log format includes timestamp, source IP, action (TCP_DENIED, TCP_TUNNEL, etc.)
logformat admiral %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt

# -----------------------------------------------------------------------------
# Cache Configuration
# -----------------------------------------------------------------------------
# Disable caching - this is a security proxy, not a performance cache
cache deny all

# Minimal memory usage
cache_mem 8 MB
maximum_object_size 0 KB

# -----------------------------------------------------------------------------
# Timeouts
# -----------------------------------------------------------------------------
# Short timeouts for security
connect_timeout 30 seconds
read_timeout 5 minutes

# -----------------------------------------------------------------------------
# Security Headers
# -----------------------------------------------------------------------------
# Don't reveal Squid version
httpd_suppress_version_string on

# Forward client IP in X-Forwarded-For (useful for debugging)
forwarded_for on

# -----------------------------------------------------------------------------
# DNS Configuration
# -----------------------------------------------------------------------------
# Use Docker's internal DNS resolver (inherits from host)
# This ensures VPN/internal DNS resolution works correctly
# Do NOT hardcode external DNS servers (8.8.8.8) as it breaks internal routing
